x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  dns: [1.1.1.1, 8.8.8.8]
  networks: [yt]
  env_file:
    - path: .env
      required: false

services:
  yt:
    <<: *hardening
    build:
      context: .
      target: api
    image: yt:latest
    container_name: yt
    ports:
      - "127.0.0.1:8190:8080"
    environment:
      CLIENT_IP_HEADER: X-Real-IP
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:size=512m,nosuid,nodev
    volumes:
      - data:/data

  bot:
    <<: *hardening
    build:
      context: .
      target: bot
    image: ytbot:latest
    container_name: ytbot
    profiles: [bot]
    ports:
      - "127.0.0.1:8191:8081"
    env_file:
      - path: .env.bot
        required: false
    environment:
      YT_API: http://yt:8080
    pids_limit: 64
    mem_limit: 64m
    depends_on: [yt]

networks:
  yt:
    driver_opts:
      com.docker.network.bridge.name: br-yt
    ipam:
      config:
        - subnet: 172.30.90.0/24

volumes:
  data:
